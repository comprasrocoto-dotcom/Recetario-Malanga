<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍗 Recetario Hot Wings</title>
  <style>
    :root {
      --primary: #B22222;
      --primary-dark: #8B0000;
      --primary-light: #FF6347;
      --gold: #FFD700;
      --dark: #1a1a1a;
      --gray: #2d2d2d;
      --light: #f5f5f5;
      --white: #ffffff;
      --border: #444;
      --success: #4CAF50;
      --warning: #FF9800;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.6rem; color: var(--white); display: flex; align-items: center; gap: 10px; }
    .sync-status {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .nav-tabs {
      background: var(--gray);
      display: flex;
      overflow-x: auto;
      border-bottom: 2px solid var(--primary);
      padding: 0 16px;
      gap: 4px;
    }
    .nav-tabs::-webkit-scrollbar { height: 3px; }
    .nav-tabs::-webkit-scrollbar-track { background: var(--gray); }
    .nav-tabs::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
    .tab-btn {
      padding: 12px 18px;
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tab-btn:hover { color: var(--light); background: rgba(255,255,255,0.05); }
    .tab-btn.active { color: var(--primary-light); border-bottom-color: var(--primary-light); }
    .search-bar {
      padding: 16px 20px;
      background: var(--gray);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--dark);
      color: var(--light);
      font-size: 0.95rem;
    }
    .search-bar input:focus { outline: none; border-color: var(--primary-light); }
    .search-bar input::placeholder { color: #666; }
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .loading .spinner {
      width: 50px; height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      background: rgba(178,34,34,0.2);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 20px;
      margin: 20px;
      color: #ffaaaa;
    }
    .error-msg h3 { color: var(--primary-light); margin-bottom: 8px; }
    .recipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .recipe-card {
      background: var(--gray);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
    }
    .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .recipe-card-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .recipe-name { font-size: 1rem; font-weight: 700; color: var(--white); line-height: 1.3; }
    .recipe-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
      margin-left: 8px;
    }
    .recipe-card-body { padding: 14px 18px; }
    .recipe-desc {
      font-size: 0.82rem;
      color: #bbb;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .recipe-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stat-badge {
      background: rgba(255,255,255,0.07);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.75rem;
    }
    .stat-badge span { color: #aaa; }
    .stat-badge strong { color: var(--light); }
    .stat-cost { border-left: 3px solid var(--warning); }
    .stat-margin { border-left: 3px solid var(--success); }
    .ingredients-count { border-left: 3px solid var(--primary-light); }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: var(--gray);
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .modal-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 1.3rem; font-weight: 700; color: var(--white); }
    .modal-price { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
    .close-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover { background: rgba(255,255,255,0.35); }
    .modal-body { padding: 24px; }
    .modal-section { margin-bottom: 22px; }
    .modal-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-light);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .desc-text { color: #ccc; line-height: 1.6; font-size: 0.9rem; }
    .process-text { color: #ccc; line-height: 1.8; font-size: 0.9rem; white-space: pre-wrap; }
    .ingredients-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .ingredients-table th {
      background: rgba(255,255,255,0.06);
      padding: 8px 10px;
      text-align: left;
      color: #aaa;
      font-weight: 600;
    }
    .ingredients-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--light);
    }
    .ingredients-table tr:hover td { background: rgba(255,255,255,0.03); }
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }
    .analysis-item {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .analysis-item .label { font-size: 0.72rem; color: #888; margin-bottom: 4px; text-transform: uppercase; }
    .analysis-item .value { font-size: 1.05rem; font-weight: 700; }
    .value-venta { color: var(--gold); }
    .value-costo { color: var(--warning); }
    .value-ganancia { color: var(--success); }
    .value-margen { color: #64b5f6; }
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .no-results .icon { font-size: 3rem; margin-bottom: 16px; }
    .category-header {
      grid-column: 1 / -1;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-light);
      padding: 8px 4px;
      border-bottom: 1px solid rgba(178,34,34,0.3);
      margin-bottom: 4px;
    }
    .banner-info {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin: 16px 20px;
      font-size: 0.82rem;
      color: #FFD700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    @media (max-width: 600px) {
      .recipes-grid { grid-template-columns: 1fr; }
      header h1 { font-size: 1.2rem; }
      .modal { margin-top: 0; border-radius: 12px 12px 0 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>🍗 Recetario Hot Wings</h1>
  <div class="sync-status">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncText">Cargando...</span>
  </div>
</header>

<div class="nav-tabs" id="navTabs">
  <button class="tab-btn active" onclick="loadSheet('COMBOS')" data-sheet="COMBOS">Combos</button>
  <button class="tab-btn" onclick="loadSheet('ALITAS')" data-sheet="ALITAS">Alitas</button>
  <button class="tab-btn" onclick="loadSheet('ENTRE PANES')" data-sheet="ENTRE PANES">Entre Panes</button>
  <button class="tab-btn" onclick="loadSheet('GUARNICIONES')" data-sheet="GUARNICIONES">Guarniciones</button>
  <button class="tab-btn" onclick="loadSheet('TEX MEX')" data-sheet="TEX MEX">Tex Mex</button>
  <button class="tab-btn" onclick="loadSheet('PARRILLA')" data-sheet="PARRILLA">Parrilla</button>
  <button class="tab-btn" onclick="loadSheet('ENSALADAS')" data-sheet="ENSALADAS">Ensaladas</button>
  <button class="tab-btn" onclick="loadSheet('ENTRADAS')" data-sheet="ENTRADAS">Entradas</button>
  <button class="tab-btn" onclick="loadSheet('MENU INFANTIL')" data-sheet="MENU INFANTIL">Menu Infantil</button>
  <button class="tab-btn" onclick="loadSheet('POSTRES')" data-sheet="POSTRES">Postres</button>
  <button class="tab-btn" onclick="loadSheet('DESAYUNOS')" data-sheet="DESAYUNOS">Desayunos</button>
  <button class="tab-btn" onclick="loadSheet('EVENTOS')" data-sheet="EVENTOS">Eventos</button>
  <button class="tab-btn" onclick="loadSheet('SUB RECETAS COCINA')" data-sheet="SUB RECETAS COCINA">Sub Recetas</button>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍  Buscar receta o ingrediente..." oninput="filterRecipes(this.value)">
</div>

<div class="banner-info" id="bannerInfo" style="display:none">
  ℹ️ Para que el recetario se actualice automáticamente desde el Excel, asegúrate de que el archivo esté compartido como <strong>"Cualquiera con el enlace puede ver"</strong> en Google Drive.
</div>

<main id="mainContent">
  <div class="loading">
    <div class="spinner"></div>
    <p>Cargando recetas desde Google Sheets...</p>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
  </div>
</div>

<script>
  const SHEET_ID = '10o7stR6GLsko2C3tSSn0Wo-MU26iTOxg';
  let allRecipes = [];
  let currentSheet = 'COMBOS';
  let sheetCache = {};

  function loadSheet(sheetName) {
    currentSheet = sheetName;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.sheet === sheetName);
    });
    document.getElementById('searchInput').value = '';
    if (sheetCache[sheetName]) {
      renderRecipes(sheetCache[sheetName]);
      return;
    }
    showLoading();
    fetchSheetData(sheetName);
  }

  function showLoading() {
    document.getElementById('mainContent').innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <p>Cargando ${currentSheet}...</p>
      </div>`;
  }

  async function fetchSheetData(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const text = await resp.text();
      const json = JSON.parse(text.replace(/^\/\*O\*\/google\.visualization\.Query\.setResponse\(/, '').replace(/\);$/, ''));
      const recipes = parseGvizData(json, sheetName);
      sheetCache[sheetName] = recipes;
      allRecipes = recipes;
      renderRecipes(recipes);
      setSyncStatus(true, `Actualizado: ${new Date().toLocaleTimeString('es-CO')}`);
      document.getElementById('bannerInfo').style.display = 'none';
    } catch(err) {
      console.error('Error fetching sheet:', err);
      showError(sheetName, err.message);
      setSyncStatus(false, 'Error de conexión');
      document.getElementById('bannerInfo').style.display = 'flex';
    }
  }

  function parseGvizData(json, sheetName) {
    const rows = json.table?.rows || [];
    const recipes = [];
    let currentRecipe = null;

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const cells = row.c || [];
      const getCellValue = (idx) => {
        if (!cells[idx] || cells[idx].v === null || cells[idx].v === undefined) return '';
        return String(cells[idx].v).trim();
      };
      const getNum = (idx) => {
        if (!cells[idx] || cells[idx].v === null || cells[idx].v === undefined) return null;
        const v = cells[idx].v;
        return typeof v === 'number' ? v : parseFloat(String(v).replace(/[^0-9.-]/g,'')) || null;
      };

      const col0 = getCellValue(0);
      const col1 = getCellValue(1);
      
      // Detect recipe header - typically a merged cell or cell with recipe name in col A
      // Recipe name cells usually have content only in col A and are followed by ingredient rows
      if (col0 && !col1 && col0.length > 3 && !col0.startsWith('ArtÍculo') && !col0.startsWith('Art') && 
          !col0.startsWith('COSTO') && !col0.startsWith('MARGEN') && !col0.startsWith('VALOR') && 
          !col0.startsWith('IPOCONSUMO') && !col0.startsWith('GANANCIA') && !col0.startsWith('Descripcion') &&
          !col0.startsWith('PROCESO') && col0 !== 'PRINCIPAL' && col0 !== '') {
        // Look ahead to see if next rows have ingredient data
        const nextRow = rows[i+1]?.c || [];
        const hasIngredients = nextRow.length > 3;
        if (hasIngredients) {
          currentRecipe = {
            nombre: col0,
            categoria: sheetName,
            ingredientes: [],
            descripcion: '',
            proceso: '',
            analisis: {
              costoplato: null, margenerror: null, costomargenerror: null,
              valorventa: null, ipoconsumo: null, valorantesipo: null,
              margen: null, ganancia: null, margenporcentual: null
            }
          };
          recipes.push(currentRecipe);
          continue;
        }
      }

      if (!currentRecipe) continue;

      // Ingredient row: col0=articulo, col1=unidad, col2=unidades netas, col3=merma, col4=unidades, col5=costo comp, col6=costo linea
      if (col0 && col1 && (col1 === 'g' || col1 === 'uds' || col1 === 'kg' || col1 === 'ml' || col1 === 'l' || col1 === 'und' || col1 === 'oz')) {
        currentRecipe.ingredientes.push({
          articulo: col0,
          unidad: col1,
          unidadesNetas: getNum(2),
          merma: getNum(3),
          unidades: getNum(4),
          costoComp: getNum(5),
          costoLinea: getNum(6)
        });
        continue;
      }
      // Also catch ingredients where col0 is empty (continuation)
      if (!col0 && col1 && (col1 === 'g' || col1 === 'uds' || col1 === 'kg' || col1 === 'ml')) {
        // Could be ingredient without name shown
        continue;
      }

      // Analysis data - typically in cols I-K (indices 8-10) or J-K
      const col8 = getCellValue(8);
      const col9 = getCellValue(9);
      const col10 = getCellValue(10) || getCellValue(11);
      
      if (col8) {
        const key = col8.toUpperCase();
        const val = getNum(10) || getNum(11);
        if (key.includes('COSTO DEL PLATO')) currentRecipe.analisis.costoplato = val;
        else if (key.includes('MARGEN DE ERROR') && !key.includes('COSTO')) currentRecipe.analisis.margenerror = val;
        else if (key.includes('COSTO + MARGEN')) currentRecipe.analisis.costomargenerror = val;
        else if (key.includes('VALOR DE VENTA')) currentRecipe.analisis.valorventa = val;
        else if (key.includes('IPOCONSUMO')) currentRecipe.analisis.ipoconsumo = val;
        else if (key.includes('VALOR ANTES')) currentRecipe.analisis.valorantesipo = val;
        else if (key === 'MARGEN.' || key === 'MARGEN') currentRecipe.analisis.margen = getCellValue(10) || getCellValue(11);
        else if (key.includes('GANANCIA')) currentRecipe.analisis.ganancia = val;
        else if (key.includes('MARGEN PORCENTUAL')) currentRecipe.analisis.margenporcentual = val;
      }
      
      // Description and Process - typically in cols L-M (indices 11-12)
      const col11 = getCellValue(11);
      const col12 = getCellValue(12);
      
      if (col11 && col11.toLowerCase().includes('descripcion')) continue;
      if (col12 && col12.length > 5 && !currentRecipe.descripcion) {
        currentRecipe.descripcion = col12;
      }
      if (col11 && col11.toLowerCase().includes('proceso')) continue;
      if (col12 && currentRecipe.descripcion && col12 !== currentRecipe.descripcion && !currentRecipe.proceso) {
        currentRecipe.proceso = col12;
      }
    }

    return recipes.filter(r => r.nombre && (r.ingredientes.length > 0 || r.analisis.valorventa));
  }

  function formatCurrency(num) {
    if (num === null || num === undefined || isNaN(num)) return '—';
    return '$ ' + Math.round(num).toLocaleString('es-CO');
  }

  function setSyncStatus(ok, text) {
    document.getElementById('syncDot').style.background = ok ? '#4CAF50' : '#f44336';
    document.getElementById('syncText').textContent = text;
  }

  function showError(sheetName, errMsg) {
    document.getElementById('mainContent').innerHTML = `
      <div class="error-msg">
        <h3>⚠️ No se pudo cargar la hoja "${sheetName}"</h3>
        <p>Error: ${errMsg}</p>
        <p style="margin-top:12px; font-size:0.85rem;">
          Para habilitar la conexión automática, abre el archivo en Google Drive y ve a<br>
          <strong>Archivo → Compartir → Compartir con otros</strong> y selecciona <strong>"Cualquiera con el enlace puede ver"</strong>.
        </p>
      </div>`;
  }

  function renderRecipes(recipes) {
    allRecipes = recipes;
    const main = document.getElementById('mainContent');
    if (!recipes || recipes.length === 0) {
      main.innerHTML = `<div class="no-results"><div class="icon">🍗</div><p>No se encontraron recetas en esta sección.</p></div>`;
      return;
    }
    main.innerHTML = `<div class="recipes-grid">${recipes.map((r, i) => recipeCard(r, i)).join('')}</div>`;
  }

  function recipeCard(r, i) {
    const precio = r.analisis.valorventa ? formatCurrency(r.analisis.valorventa) : '';
    const costo = r.analisis.costoplato ? formatCurrency(r.analisis.costoplato) : '';
    const margen = r.analisis.margen || '';
    const ingCount = r.ingredientes.length;
    return `
      <div class="recipe-card" onclick="openModal(${i})">
        <div class="recipe-card-header">
          <div class="recipe-name">${r.nombre}</div>
          ${precio ? `<div class="recipe-price">${precio}</div>` : ''}
        </div>
        <div class="recipe-card-body">
          ${r.descripcion ? `<div class="recipe-desc">${r.descripcion}</div>` : ''}
          <div class="recipe-stats">
            ${costo ? `<div class="stat-badge stat-cost"><span>Costo: </span><strong>${costo}</strong></div>` : ''}
            ${margen ? `<div class="stat-badge stat-margin"><span>Margen: </span><strong>${margen}</strong></div>` : ''}
            ${ingCount > 0 ? `<div class="stat-badge ingredients-count"><span>Ingredientes: </span><strong>${ingCount}</strong></div>` : ''}
          </div>
        </div>
      </div>`;
  }

  function openModal(idx) {
    const r = allRecipes[idx];
    if (!r) return;
    const overlay = document.getElementById('modalOverlay');
    const modal = document.getElementById('modalContent');
    modal.innerHTML = `
      <div class="modal-header">
        <div>
          <div class="modal-title">${r.nombre}</div>
          <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-top:4px">${r.categoria}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          ${r.analisis.valorventa ? `<div class="modal-price">${formatCurrency(r.analisis.valorventa)}</div>` : ''}
          <button class="close-btn" onclick="closeModalBtn()">✕</button>
        </div>
      </div>
      <div class="modal-body">
        ${r.descripcion ? `
          <div class="modal-section">
            <h3>📋 Descripción de la carta</h3>
            <p class="desc-text">${r.descripcion}</p>
          </div>` : ''}
        ${r.ingredientes.length > 0 ? `
          <div class="modal-section">
            <h3>🧂 Ingredientes</h3>
            <table class="ingredients-table">
              <thead>
                <tr>
                  <th>Artículo</th>
                  <th>Unidad</th>
                  <th>Unidades</th>
                  <th>% Merma</th>
                  <th>Costo Línea</th>
                </tr>
              </thead>
              <tbody>
                ${r.ingredientes.map(ing => `
                  <tr>
                    <td>${ing.articulo}</td>
                    <td>${ing.unidad}</td>
                    <td>${ing.unidades || ''}</td>
                    <td>${ing.merma !== null ? ing.merma + '%' : ''}</td>
                    <td>${ing.costoLinea !== null ? formatCurrency(ing.costoLinea) : ''}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>` : ''}
        <div class="modal-section">
          <h3>📊 Análisis de Costos</h3>
          <div class="analysis-grid">
            ${r.analisis.costoplato !== null ? `<div class="analysis-item"><div class="label">Costo del Plato</div><div class="value value-costo">${formatCurrency(r.analisis.costoplato)}</div></div>` : ''}
            ${r.analisis.costomargenerror !== null ? `<div class="analysis-item"><div class="label">Costo + Margen Error</div><div class="value value-costo">${formatCurrency(r.analisis.costomargenerror)}</div></div>` : ''}
            ${r.analisis.valorventa !== null ? `<div class="analysis-item"><div class="label">Valor de Venta</div><div class="value value-venta">${formatCurrency(r.analisis.valorventa)}</div></div>` : ''}
            ${r.analisis.valorantesipo !== null ? `<div class="analysis-item"><div class="label">Valor antes de IPO</div><div class="value">${formatCurrency(r.analisis.valorantesipo)}</div></div>` : ''}
            ${r.analisis.ipoconsumo !== null ? `<div class="analysis-item"><div class="label">IpoConsumo</div><div class="value">${formatCurrency(r.analisis.ipoconsumo)}</div></div>` : ''}
            ${r.analisis.ganancia !== null ? `<div class="analysis-item"><div class="label">Ganancia</div><div class="value value-ganancia">${formatCurrency(r.analisis.ganancia)}</div></div>` : ''}
            ${r.analisis.margen ? `<div class="analysis-item"><div class="label">Margen</div><div class="value value-margen">${r.analisis.margen}</div></div>` : ''}
            ${r.analisis.margenporcentual !== null ? `<div class="analysis-item"><div class="label">Margen Porcentual</div><div class="value value-margen">${r.analisis.margenporcentual}</div></div>` : ''}
          </div>
        </div>
        ${r.proceso ? `
          <div class="modal-section">
            <h3>👨‍🍳 Proceso de Elaboración</h3>
            <p class="process-text">${r.proceso}</p>
          </div>` : ''}
      </div>`;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
  }
  function closeModalBtn() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModalBtn();
  });

  function filterRecipes(query) {
    const q = query.toLowerCase().trim();
    if (!q) { renderRecipes(allRecipes); return; }
    const filtered = allRecipes.filter(r =>
      r.nombre.toLowerCase().includes(q) ||
      (r.descripcion && r.descripcion.toLowerCase().includes(q)) ||
      r.ingredientes.some(ing => ing.articulo.toLowerCase().includes(q))
    );
    const main = document.getElementById('mainContent');
    if (filtered.length === 0) {
      main.innerHTML = `<div class="no-results"><div class="icon">🔍</div><p>No se encontraron resultados para "<strong>${query}</strong>"</p></div>`;
    } else {
      main.innerHTML = `<div class="recipes-grid">${filtered.map((r, i) => recipeCard(r, allRecipes.indexOf(r))).join('')}</div>`;
    }
  }

  // Auto-refresh every 5 minutes
  setInterval(() => {
    delete sheetCache[currentSheet];
    loadSheet(currentSheet);
  }, 5 * 60 * 1000);

  // Initial load
  loadSheet('COMBOS');
</script>
</body>
</html>
