<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍗 Recetario Hot Wings</title>
  <style>
    :root {
      --primary: #B22222;
      --primary-dark: #8B0000;
      --primary-light: #FF6347;
      --gold: #FFD700;
      --dark: #1a1a1a;
      --gray: #2d2d2d;
      --light: #f5f5f5;
      --white: #ffffff;
      --border: #444;
      --success: #4CAF50;
      --warning: #FF9800;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--dark); color: var(--light); min-height: 100vh; }
    header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.5rem; color: var(--white); display: flex; align-items: center; gap: 10px; }
    .sync-status { font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.15); color: var(--white); display: flex; align-items: center; gap: 6px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .nav-tabs { background: var(--gray); display: flex; overflow-x: auto; border-bottom: 2px solid var(--primary); padding: 0 16px; gap: 4px; scrollbar-width: thin; }
    .nav-tabs::-webkit-scrollbar { height: 3px; }
    .nav-tabs::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
    .tab-btn { padding: 12px 16px; background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.82rem; font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
    .tab-btn:hover { color: var(--light); background: rgba(255,255,255,0.05); }
    .tab-btn.active { color: var(--primary-light); border-bottom-color: var(--primary-light); }
    .search-bar { padding: 14px 20px; background: var(--gray); display: flex; align-items: center; gap: 12px; }
    .search-bar input { flex: 1; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--dark); color: var(--light); font-size: 0.95rem; }
    .search-bar input:focus { outline: none; border-color: var(--primary-light); }
    .search-bar input::placeholder { color: #666; }
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .loading { text-align: center; padding: 60px 20px; color: #aaa; }
    .loading .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary-light); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { background: rgba(178,34,34,0.2); border: 1px solid var(--primary); border-radius: 8px; padding: 20px; margin: 20px 0; color: #ffaaaa; }
    .error-msg h3 { color: var(--primary-light); margin-bottom: 8px; }
    .recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
    .recipe-card { background: var(--gray); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid var(--border); }
    .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .recipe-card-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
    .recipe-name { font-size: 0.95rem; font-weight: 700; color: var(--white); line-height: 1.3; }
    .recipe-price { font-size: 1.1rem; font-weight: 800; color: var(--gold); white-space: nowrap; margin-left: 8px; }
    .recipe-card-body { padding: 12px 16px; }
    .recipe-desc { font-size: 0.8rem; color: #bbb; line-height: 1.5; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .recipe-stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat-badge { background: rgba(255,255,255,0.07); border-radius: 6px; padding: 4px 8px; font-size: 0.72rem; }
    .stat-badge span { color: #aaa; }
    .stat-badge strong { color: var(--light); }
    .stat-cost { border-left: 3px solid var(--warning); }
    .stat-margin { border-left: 3px solid var(--success); }
    .ingredients-count { border-left: 3px solid var(--primary-light); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; padding: 20px; }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal { background: var(--gray); border-radius: 16px; max-width: 780px; width: 100%; margin-top: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); overflow: hidden; }
    .modal-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--white); }
    .modal-price { font-size: 1.4rem; font-weight: 800; color: var(--gold); }
    .close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: rgba(255,255,255,0.35); }
    .modal-body { padding: 22px; }
    .modal-section { margin-bottom: 20px; }
    .modal-section h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-light); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .desc-text, .process-text { color: #ccc; line-height: 1.6; font-size: 0.88rem; }
    .process-text { white-space: pre-wrap; }
    .ingredients-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .ingredients-table th { background: rgba(255,255,255,0.06); padding: 7px 10px; text-align: left; color: #aaa; font-weight: 600; }
    .ingredients-table td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--light); }
    .ingredients-table tr:hover td { background: rgba(255,255,255,0.03); }
    .analysis-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .analysis-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px 12px; }
    .analysis-item .label { font-size: 0.7rem; color: #888; margin-bottom: 4px; text-transform: uppercase; }
    .analysis-item .value { font-size: 1rem; font-weight: 700; }
    .value-venta { color: var(--gold); }
    .value-costo { color: var(--warning); }
    .value-ganancia { color: var(--success); }
    .value-margen { color: #64b5f6; }
    .no-results { text-align: center; padding: 60px 20px; color: #666; }
    .no-results .icon { font-size: 3rem; margin-bottom: 16px; }
    @media (max-width: 600px) { .recipes-grid { grid-template-columns: 1fr; } header h1 { font-size: 1.2rem; } }
  </style>
</head>
<body>
<header>
  <h1>🍗 Recetario Hot Wings</h1>
  <div class="sync-status">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncText">Cargando...</span>
  </div>
</header>

<div class="nav-tabs" id="navTabs">
  <button class="tab-btn active" data-sheet="COMBOS" onclick="loadSheet(this)">Combos</button>
  <button class="tab-btn" data-sheet="ALITAS" onclick="loadSheet(this)">Alitas</button>
  <button class="tab-btn" data-sheet="ENTRE PANES" onclick="loadSheet(this)">Entre Panes</button>
  <button class="tab-btn" data-sheet="GUARNICIONES" onclick="loadSheet(this)">Guarniciones</button>
  <button class="tab-btn" data-sheet="TEX MEX" onclick="loadSheet(this)">Tex Mex</button>
  <button class="tab-btn" data-sheet="PARRILLA" onclick="loadSheet(this)">Parrilla</button>
  <button class="tab-btn" data-sheet="ENSALADAS" onclick="loadSheet(this)">Ensaladas</button>
  <button class="tab-btn" data-sheet="ENTRADAS" onclick="loadSheet(this)">Entradas</button>
  <button class="tab-btn" data-sheet="MENU INFANTIL" onclick="loadSheet(this)">Menu Infantil</button>
  <button class="tab-btn" data-sheet="POSTRES" onclick="loadSheet(this)">Postres</button>
  <button class="tab-btn" data-sheet="DESAYUNOS" onclick="loadSheet(this)">Desayunos</button>
  <button class="tab-btn" data-sheet="EVENTOS" onclick="loadSheet(this)">Eventos</button>
  <button class="tab-btn" data-sheet="SUB RECETAS COCINA" onclick="loadSheet(this)">Sub Recetas</button>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍  Buscar receta o ingrediente..." oninput="filterRecipes(this.value)">
</div>

<main id="mainContent">
  <div class="loading"><div class="spinner"></div><p>Cargando recetas desde Google Sheets...</p></div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const SHEET_ID = '10o7stR6GLsko2C3tSSn0Wo-MU26iTOxg';
// Use a CORS proxy for public Google Sheets CSV export
const PROXY = 'https://corsproxy.io/?';
let allRecipes = [];
let currentSheetName = 'COMBOS';
let sheetCache = {};

function loadSheet(btn) {
  const sheetName = btn ? btn.dataset.sheet : currentSheetName;
  currentSheetName = sheetName;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.sheet === sheetName));
  document.getElementById('searchInput').value = '';
  if (sheetCache[sheetName]) { renderRecipes(sheetCache[sheetName]); return; }
  showLoading(sheetName);
  fetchCSV(sheetName);
}

function showLoading(name) {
  document.getElementById('mainContent').innerHTML = `<div class="loading"><div class="spinner"></div><p>Cargando ${name}...</p></div>`;
}

async function fetchCSV(sheetName) {
  const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=${encodeURIComponent(sheetName)}`;
  const proxyUrl = PROXY + encodeURIComponent(csvUrl);
  try {
    const resp = await fetch(proxyUrl);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    if (text.includes('<!DOCTYPE') || text.includes('<html')) throw new Error('Respuesta HTML inesperada');
    const rows = parseCSV(text);
    const recipes = parseRecipes(rows, sheetName);
    sheetCache[sheetName] = recipes;
    allRecipes = recipes;
    renderRecipes(recipes);
    setSyncStatus(true, 'Actualizado: ' + new Date().toLocaleTimeString('es-CO'));
  } catch(err) {
    console.error('Error:', err);
    showError(sheetName, err.message);
    setSyncStatus(false, 'Error conexión');
  }
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  return lines.map(line => {
    const cells = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuotes = !inQuotes; }
      else if (line[i] === ',' && !inQuotes) { cells.push(current.trim()); current = ''; }
      else { current += line[i]; }
    }
    cells.push(current.trim());
    return cells;
  });
}

function parseRecipes(rows, sheetName) {
  const recipes = [];
  let currentRecipe = null;

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const c = (idx) => (row[idx] || '').replace(/^"|"$/g,'').trim();
    const n = (idx) => { const v = parseFloat(c(idx).replace(/[^0-9.-]/g,'')); return isNaN(v) ? null : v; };

    const col0 = c(0), col1 = c(1);
    
    // Detect recipe name: non-empty col0, empty col1, not a known field label
    const skipPrefixes = ['COSTO','MARGEN','VALOR','IPOCONSUMO','GANANCIA','Descripcion','PROCESO','PRINCIPAL','ArtÍculo','Art','Nombre'];
    const isSkip = skipPrefixes.some(p => col0.toUpperCase().startsWith(p.toUpperCase()));
    
    if (col0 && !col1 && !isSkip && col0.length > 2) {
      // Likely a recipe name - check if next rows have ingredients
      const nextRow = rows[i+1] || [];
      const nextCol1 = (nextRow[1] || '').trim();
      const isIngredient = ['g','uds','kg','ml','l','und','oz','un'].includes(nextCol1.toLowerCase());
      
      if (isIngredient || col0.toUpperCase().includes('COMBO') || col0.toUpperCase().includes('ALITA') || col0.toUpperCase().includes('PANE') || col0.toUpperCase().includes('SANDWICH')) {
        currentRecipe = {
          nombre: col0,
          categoria: sheetName,
          ingredientes: [],
          descripcion: '',
          proceso: '',
          analisis: { costoplato: null, margenerror: null, costomargenerror: null, valorventa: null, ipoconsumo: null, valorantesipo: null, margen: '', ganancia: null, margenporcentual: null }
        };
        recipes.push(currentRecipe);
        continue;
      }
    }

    if (!currentRecipe) continue;

    // Ingredient rows: col0=articulo, col1=unit
    const units = ['g','uds','kg','ml','l','und','oz','un','gr'];
    if ((col0 || col1) && units.includes(col1.toLowerCase())) {
      currentRecipe.ingredientes.push({
        articulo: col0 || '—',
        unidad: col1,
        unidades: n(4) || n(2),
        merma: n(3),
        costoLinea: n(6) || n(7)
      });
      continue;
    }

    // Analysis - columns 8-11 (I-L)
    const col8 = c(8).toUpperCase();
    if (col8) {
      const val = n(10) !== null ? n(10) : n(11);
      if (col8.includes('COSTO DEL PLATO')) currentRecipe.analisis.costoplato = val;
      else if (col8.includes('MARGEN DE ERROR') && !col8.includes('COSTO')) currentRecipe.analisis.margenerror = val;
      else if (col8.includes('COSTO + MARGEN') || col8.includes('COSTO+MARGEN')) currentRecipe.analisis.costomargenerror = val;
      else if (col8.includes('VALOR DE VENTA')) currentRecipe.analisis.valorventa = val;
      else if (col8.includes('IPOCONSUMO')) currentRecipe.analisis.ipoconsumo = val;
      else if (col8.includes('VALOR ANTES')) currentRecipe.analisis.valorantesipo = val;
      else if (col8 === 'MARGEN.' || col8 === 'MARGEN') currentRecipe.analisis.margen = c(10) || c(11);
      else if (col8.includes('GANANCIA')) currentRecipe.analisis.ganancia = val;
      else if (col8.includes('MARGEN PORCENTUAL')) currentRecipe.analisis.margenporcentual = val;
    }

    // Description/Process - columns 11-12 (L-M)
    const col11 = c(11), col12 = c(12);
    if (col11.toUpperCase().includes('DESCRIPCION') || col11.toUpperCase().includes('PROCESO')) { /* skip header */ continue; }
    if (col12 && col12.length > 5) {
      if (!currentRecipe.descripcion) currentRecipe.descripcion = col12;
      else if (!currentRecipe.proceso && col12 !== currentRecipe.descripcion) currentRecipe.proceso = col12;
    }
  }

  return recipes.filter(r => r.nombre && (r.ingredientes.length > 0 || r.analisis.valorventa !== null));
}

function formatCOP(num) {
  if (num === null || num === undefined || isNaN(num)) return '—';
  return '$ ' + Math.round(num).toLocaleString('es-CO');
}

function setSyncStatus(ok, text) {
  document.getElementById('syncDot').style.background = ok ? '#4CAF50' : '#f44336';
  document.getElementById('syncText').textContent = text;
}

function showError(sheetName, errMsg) {
  document.getElementById('mainContent').innerHTML = `
    <div class="error-msg">
      <h3>⚠️ No se pudo cargar "${sheetName}"</h3>
      <p style="margin-bottom:8px">Error: ${errMsg}</p>
      <p style="font-size:0.82rem;color:#aaa">Verifica que el archivo esté compartido como <strong>"Cualquiera con el enlace puede ver"</strong> en Google Drive.</p>
    </div>`;
}

function renderRecipes(recipes) {
  allRecipes = recipes;
  const main = document.getElementById('mainContent');
  if (!recipes || recipes.length === 0) {
    main.innerHTML = `<div class="no-results"><div class="icon">🍗</div><p>No se encontraron recetas.</p></div>`;
    return;
  }
  main.innerHTML = `<div class="recipes-grid">${recipes.map((r,i) => recipeCard(r,i)).join('')}</div>`;
}

function recipeCard(r, i) {
  const precio = r.analisis.valorventa !== null ? formatCOP(r.analisis.valorventa) : '';
  const costo = r.analisis.costoplato !== null ? formatCOP(r.analisis.costoplato) : '';
  const margen = r.analisis.margen || '';
  return `
    <div class="recipe-card" onclick="openModal(${i})">
      <div class="recipe-card-header">
        <div class="recipe-name">${r.nombre}</div>
        ${precio ? `<div class="recipe-price">${precio}</div>` : ''}
      </div>
      <div class="recipe-card-body">
        ${r.descripcion ? `<div class="recipe-desc">${r.descripcion}</div>` : ''}
        <div class="recipe-stats">
          ${costo ? `<div class="stat-badge stat-cost"><span>Costo: </span><strong>${costo}</strong></div>` : ''}
          ${margen ? `<div class="stat-badge stat-margin"><span>Margen: </span><strong>${margen}</strong></div>` : ''}
          ${r.ingredientes.length ? `<div class="stat-badge ingredients-count"><span>Ingredientes: </span><strong>${r.ingredientes.length}</strong></div>` : ''}
        </div>
      </div>
    </div>`;
}

function openModal(idx) {
  const r = allRecipes[idx];
  if (!r) return;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-title">${r.nombre}</div>
        <div style="font-size:0.75rem;color:rgba(255,255,255,0.6);margin-top:3px">${r.categoria}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${r.analisis.valorventa !== null ? `<div class="modal-price">${formatCOP(r.analisis.valorventa)}</div>` : ''}
        <button class="close-btn" onclick="closeModalBtn()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      ${r.descripcion ? `<div class="modal-section"><h3>📋 Descripción de la carta</h3><p class="desc-text">${r.descripcion}</p></div>` : ''}
      ${r.ingredientes.length ? `
        <div class="modal-section">
          <h3>🧂 Ingredientes</h3>
          <table class="ingredients-table">
            <thead><tr><th>Artículo</th><th>Unidad</th><th>Unidades</th><th>% Merma</th><th>Costo Línea</th></tr></thead>
            <tbody>
              ${r.ingredientes.map(ing => `<tr>
                <td>${ing.articulo}</td><td>${ing.unidad}</td>
                <td>${ing.unidades !== null ? ing.unidades : ''}</td>
                <td>${ing.merma !== null ? ing.merma+'%' : ''}</td>
                <td>${ing.costoLinea !== null ? formatCOP(ing.costoLinea) : ''}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}
      <div class="modal-section">
        <h3>📊 Análisis de Costos</h3>
        <div class="analysis-grid">
          ${r.analisis.costoplato !== null ? `<div class="analysis-item"><div class="label">Costo del Plato</div><div class="value value-costo">${formatCOP(r.analisis.costoplato)}</div></div>` : ''}
          ${r.analisis.costomargenerror !== null ? `<div class="analysis-item"><div class="label">Costo + Error</div><div class="value value-costo">${formatCOP(r.analisis.costomargenerror)}</div></div>` : ''}
          ${r.analisis.valorventa !== null ? `<div class="analysis-item"><div class="label">Valor de Venta</div><div class="value value-venta">${formatCOP(r.analisis.valorventa)}</div></div>` : ''}
          ${r.analisis.valorantesipo !== null ? `<div class="analysis-item"><div class="label">Antes de IPO</div><div class="value">${formatCOP(r.analisis.valorantesipo)}</div></div>` : ''}
          ${r.analisis.ipoconsumo !== null ? `<div class="analysis-item"><div class="label">IpoConsumo</div><div class="value">${formatCOP(r.analisis.ipoconsumo)}</div></div>` : ''}
          ${r.analisis.ganancia !== null ? `<div class="analysis-item"><div class="label">Ganancia</div><div class="value value-ganancia">${formatCOP(r.analisis.ganancia)}</div></div>` : ''}
          ${r.analisis.margen ? `<div class="analysis-item"><div class="label">Margen</div><div class="value value-margen">${r.analisis.margen}</div></div>` : ''}
          ${r.analisis.margenporcentual !== null ? `<div class="analysis-item"><div class="label">Margen %</div><div class="value value-margen">${r.analisis.margenporcentual}</div></div>` : ''}
        </div>
      </div>
      ${r.proceso ? `<div class="modal-section"><h3>👨‍🍳 Proceso de Elaboración</h3><p class="process-text">${r.proceso}</p></div>` : ''}
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) closeModalBtn(); }
function closeModalBtn() { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalBtn(); });

function filterRecipes(query) {
  const q = query.toLowerCase().trim();
  if (!q) { renderRecipes(allRecipes); return; }
  const filtered = allRecipes.filter(r =>
    r.nombre.toLowerCase().includes(q) ||
    (r.descripcion && r.descripcion.toLowerCase().includes(q)) ||
    r.ingredientes.some(ing => ing.articulo.toLowerCase().includes(q))
  );
  const main = document.getElementById('mainContent');
  if (filtered.length === 0) {
    main.innerHTML = `<div class="no-results"><div class="icon">🔍</div><p>Sin resultados para "<strong>${query}</strong>"</p></div>`;
  } else {
    main.innerHTML = `<div class="recipes-grid">${filtered.map((r,i) => recipeCard(r,allRecipes.indexOf(r))).join('')}</div>`;
  }
}

// Auto-refresh cada 5 minutos
setInterval(() => { delete sheetCache[currentSheetName]; loadSheet(null); }, 5 * 60 * 1000);

// Carga inicial
loadSheet(document.querySelector('.tab-btn.active'));
</script>
</body>
</html>
