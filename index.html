<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍗 Recetario Hot Wings</title>
  <style>
    :root{--p:#B22222;--pd:#8B0000;--pl:#FF6347;--g:#FFD700;--d:#1a1a1a;--gr:#2d2d2d;--l:#f5f5f5;--w:#fff;--b:#444;--s:#4CAF50;--wa:#FF9800;--sh:0 4px 20px rgba(0,0,0,.3)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:var(--d);color:var(--l);min-height:100vh}
    header{background:linear-gradient(135deg,var(--pd),var(--p));padding:14px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh);position:sticky;top:0;z-index:100}
    h1{font-size:1.4rem;color:var(--w);display:flex;align-items:center;gap:8px}
    .ss{font-size:.72rem;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:var(--w);display:flex;align-items:center;gap:6px}
    .sd{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .nav{background:var(--gr);display:flex;overflow-x:auto;border-bottom:2px solid var(--p);padding:0 14px;gap:2px;scrollbar-width:thin}
    .nav::-webkit-scrollbar{height:3px}
    .nav::-webkit-scrollbar-thumb{background:var(--p)}
    .tb{padding:11px 14px;background:none;border:none;color:#aaa;cursor:pointer;font-size:.78rem;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;text-transform:uppercase}
    .tb:hover{color:var(--l);background:rgba(255,255,255,.05)}
    .tb.active{color:var(--pl);border-bottom-color:var(--pl)}
    .sb{padding:12px 18px;background:var(--gr);display:flex;align-items:center}
    .sb input{flex:1;padding:9px 14px;border-radius:8px;border:1px solid var(--b);background:var(--d);color:var(--l);font-size:.9rem}
    .sb input:focus{outline:none;border-color:var(--pl)}
    .sb input::placeholder{color:#666}
    main{padding:18px;max-width:1400px;margin:0 auto}
    .loading{text-align:center;padding:60px 20px;color:#aaa}
    .sp{width:48px;height:48px;border:4px solid var(--b);border-top-color:var(--pl);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err{background:rgba(178,34,34,.2);border:1px solid var(--p);border-radius:8px;padding:18px;margin:16px 0;color:#ffaaaa}
    .err h3{color:var(--pl);margin-bottom:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .card{background:var(--gr);border-radius:12px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid var(--b)}
    .card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
    .ch{background:linear-gradient(135deg,var(--pd),var(--p));padding:13px 15px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .cn{font-size:.9rem;font-weight:700;color:var(--w);line-height:1.3}
    .cp{font-size:1rem;font-weight:800;color:var(--g);white-space:nowrap}
    .cb{padding:11px 15px}
    .cd{font-size:.78rem;color:#bbb;line-height:1.5;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cs{display:flex;gap:7px;flex-wrap:wrap}
    .badge{background:rgba(255,255,255,.07);border-radius:5px;padding:3px 8px;font-size:.7rem}
    .badge span{color:#aaa}.badge strong{color:var(--l)}
    .bc{border-left:3px solid var(--wa)}.bm{border-left:3px solid var(--s)}.bi{border-left:3px solid var(--pl)}
    .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;overflow-y:auto;padding:18px}
    .ov.open{display:flex;align-items:flex-start;justify-content:center}
    .mo{background:var(--gr);border-radius:14px;max-width:760px;width:100%;margin-top:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
    .mh{background:linear-gradient(135deg,var(--pd),var(--p));padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
    .mt{font-size:1.1rem;font-weight:700;color:var(--w)}
    .mp{font-size:1.3rem;font-weight:800;color:var(--g)}
    .xb{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
    .xb:hover{background:rgba(255,255,255,.35)}
    .mb{padding:20px}
    .ms{margin-bottom:18px}
    .ms h3{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--pl);margin-bottom:9px;border-bottom:1px solid var(--b);padding-bottom:5px}
    .dt,.pt{color:#ccc;line-height:1.6;font-size:.85rem}
    .pt{white-space:pre-wrap}
    table{width:100%;border-collapse:collapse;font-size:.78rem}
    th{background:rgba(255,255,255,.06);padding:6px 9px;text-align:left;color:#aaa;font-weight:600}
    td{padding:5px 9px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--l)}
    tr:hover td{background:rgba(255,255,255,.03)}
    .ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .ai{background:rgba(255,255,255,.05);border-radius:7px;padding:9px 11px}
    .ai .lb{font-size:.68rem;color:#888;margin-bottom:3px;text-transform:uppercase}
    .ai .vl{font-size:.95rem;font-weight:700}
    .vv{color:var(--g)}.vc{color:var(--wa)}.vg{color:var(--s)}.vm{color:#64b5f6}
    .nr{text-align:center;padding:60px 20px;color:#666}
    .nr .ic{font-size:3rem;margin-bottom:14px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:1.1rem}}
  </style>
</head>
<body>
<header>
  <h1>🍗 Recetario Hot Wings</h1>
  <div class="ss"><div class="sd" id="sd"></div><span id="st">Cargando...</span></div>
</header>
<div class="nav" id="nav">
  <button class="tb active" data-sheet="COMBOS" onclick="loadSheet(this)">Combos</button>
  <button class="tb" data-sheet="ALITAS" onclick="loadSheet(this)">Alitas</button>
  <button class="tb" data-sheet="ENTRE PANES" onclick="loadSheet(this)">Entre Panes</button>
  <button class="tb" data-sheet="GUARNICIONES" onclick="loadSheet(this)">Guarniciones</button>
  <button class="tb" data-sheet="TEX MEX" onclick="loadSheet(this)">Tex Mex</button>
  <button class="tb" data-sheet="PARRILLA" onclick="loadSheet(this)">Parrilla</button>
  <button class="tb" data-sheet="ENSALADAS" onclick="loadSheet(this)">Ensaladas</button>
  <button class="tb" data-sheet="ENTRADAS" onclick="loadSheet(this)">Entradas</button>
  <button class="tb" data-sheet="MENU INFANTIL" onclick="loadSheet(this)">Infantil</button>
  <button class="tb" data-sheet="POSTRES" onclick="loadSheet(this)">Postres</button>
  <button class="tb" data-sheet="DESAYUNOS" onclick="loadSheet(this)">Desayunos</button>
  <button class="tb" data-sheet="EVENTOS" onclick="loadSheet(this)">Eventos</button>
  <button class="tb" data-sheet="SUB RECETAS COCINA" onclick="loadSheet(this)">Sub Recetas</button>
</div>
<div class="sb"><input type="text" id="si" placeholder="🔍 Buscar receta o ingrediente..." oninput="filterRecipes(this.value)"></div>
<main id="mc"><div class="loading"><div class="sp"></div><p>Cargando desde Google Sheets...</p></div></main>
<div class="ov" id="ov" onclick="closeModal(event)"><div class="mo" id="mo"></div></div>
<script>
const SID='10o7stR6GLsko2C3tSSn0Wo-MU26iTOxg';
const PX='https://corsproxy.io/?';
let AR=[],CS='COMBOS',CA={};

function loadSheet(btn){
  const n=btn?btn.dataset.sheet:CS; CS=n;
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('active',b.dataset.sheet===n));
  document.getElementById('si').value='';
  if(CA[n]){renderRecipes(CA[n]);return;}
  document.getElementById('mc').innerHTML='<div class="loading"><div class="sp"></div><p>Cargando '+n+'...</p></div>';
  fetchCSV(n);
}

async function fetchCSV(n){
  const url=PX+encodeURIComponent('https://docs.google.com/spreadsheets/d/'+SID+'/export?format=csv&sheet='+encodeURIComponent(n));
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();
    if(txt.includes('<!DOCTYPE'))throw new Error('Auth required');
    const rows=parseCSV(txt);
    const rec=parseRecipes(rows,n);
    CA[n]=rec; AR=rec;
    renderRecipes(rec);
    setSS(true,'Actualizado: '+new Date().toLocaleTimeString('es-CO'));
  }catch(e){
    document.getElementById('mc').innerHTML='<div class="err"><h3>⚠️ Error: '+n+'</h3><p>'+e.message+'</p><p style="margin-top:8px;font-size:.8rem;color:#aaa">Asegurate de compartir como <strong>"Cualquiera con el enlace puede ver"</strong>.</p></div>';
    setSS(false,'Error');
  }
}

function parseCSV(txt){
  return txt.split(/\r?\n/).map(line=>{
    const c=[];let cur='',q=false;
    for(const ch of line){
      if(ch==='"'){q=!q;}else if(ch===','&&!q){c.push(cur.trim());cur='';}else{cur+=ch;}
    }
    c.push(cur.trim());return c;
  });
}

function cl(v){
  return(v||'').replace(/^"+|"+$/g,'')
    .replace(/Ã­/g,'í').replace(/Ã©/g,'é').replace(/Ã³/g,'ó').replace(/Ã¡/g,'á')
    .replace(/Ã±/g,'ñ').replace(/Ã/g,'A').replace(/Â /g,' ').trim();
}
function nm(v){const n=parseFloat((v||'').replace(/[^0-9.-]/g,''));return isNaN(n)?null:n;}

function parseRecipes(rows,sn){
  const recs=[];
  let rec=null;
  const skip=['COSTO','MARGEN','VALOR','IPOCONSUMO','GANANCIA','ART','PROCESO','PRINCIPAL'];
  const us=['g','uds','kg','ml','l','und','oz','un','gr'];

  for(const row of rows){
    const c0=cl(row[0]),c1=cl(row[1]),c2=cl(row[2]);
    const c5=cl(row[5]),c7=cl(row[7]);
    const c9=cl(row[9]),c10=cl(row[10]),c12=cl(row[12]);
    const isSkip=skip.some(p=>c1.toUpperCase().startsWith(p));
    const isUnit=us.includes(c2.toLowerCase());

    // Recipe name: col0 EMPTY, col1 has name, col2 empty, not a skip word, not a unit
    if(!c0&&c1&&!c2&&!isSkip&&c1.length>2&&!isUnit){
      rec={n:c1,cat:sn,ing:[],desc:'',proc:'',an:{cp:null,cv:null,cg:null,ma:''}};
      recs.push(rec);
      continue;
    }
    if(!rec)continue;

    // Ingredient: col0 empty, col1=name, col2=unit
    if(!c0&&c1&&isUnit){
      rec.ing.push({a:c1,u:c2,un:nm(c5)||nm(cl(row[3])),me:nm(cl(row[4])),cl:nm(c7)||nm(cl(row[6]))});
      continue;
    }

    // Analysis: col9=label, col10=value
    if(c9){
      const l=c9.toUpperCase();const v=nm(c10);
      if(l.includes('COSTO DEL PLATO'))rec.an.cp=v;
      else if(l.includes('VALOR DE VENTA'))rec.an.cv=v;
      else if(l.includes('GANANCIA'))rec.an.cg=v;
      else if(l==='MARGEN.'||l==='MARGEN')rec.an.ma=c10;
    }

    // Description col12 (only when col0 and col1 are empty)
    if(!c0&&!c1&&c12&&c12.length>5){
      if(!rec.desc)rec.desc=c12;
      else if(!rec.proc&&c12!==rec.desc)rec.proc=c12;
    }
  }
  return recs.filter(r=>r.n&&(r.ing.length>0||r.an.cv!==null));
}

function fCOP(n){if(n===null||isNaN(n))return'—';return'$ '+Math.round(n).toLocaleString('es-CO');}
function setSS(ok,t){document.getElementById('sd').style.background=ok?'#4CAF50':'#f44336';document.getElementById('st').textContent=t;}

function renderRecipes(recs){
  AR=recs;
  const mc=document.getElementById('mc');
  if(!recs||!recs.length){mc.innerHTML='<div class="nr"><div class="ic">🍗</div><p>No se encontraron recetas.</p></div>';return;}
  mc.innerHTML='<div class="grid">'+recs.map((r,i)=>card(r,i)).join('')+'</div>';
}

function card(r,i){
  const p=r.an.cv!==null?fCOP(r.an.cv):'';
  const c=r.an.cp!==null?fCOP(r.an.cp):'';
  return'<div class="card" onclick="openM('+i+')">'+
    '<div class="ch"><div class="cn">'+r.n+'</div>'+(p?'<div class="cp">'+p+'</div>':'')+' </div>'+
    '<div class="cb">'+(r.desc?'<div class="cd">'+r.desc+'</div>':'')+
    '<div class="cs">'+(c?'<div class="badge bc"><span>Costo: </span><strong>'+c+'</strong></div>':'')+
    (r.an.ma?'<div class="badge bm"><span>Margen: </span><strong>'+r.an.ma+'</strong></div>':'')+
    (r.ing.length?'<div class="badge bi"><span>Ingredientes: </span><strong>'+r.ing.length+'</strong></div>':'')+
    '</div></div></div>';
}

function openM(i){
  const r=AR[i];if(!r)return;
  document.getElementById('mo').innerHTML=
    '<div class="mh"><div><div class="mt">'+r.n+'</div><div style="font-size:.72rem;color:rgba(255,255,255,.6);margin-top:2px">'+r.cat+'</div></div>'+
    '<div style="display:flex;align-items:center;gap:10px">'+(r.an.cv!==null?'<div class="mp">'+fCOP(r.an.cv)+'</div>':'')+
    '<button class="xb" onclick="closeM()">✕</button></div></div>'+
    '<div class="mb">'+
    (r.desc?'<div class="ms"><h3>📋 Descripción de la carta</h3><p class="dt">'+r.desc+'</p></div>':'')+
    (r.ing.length?'<div class="ms"><h3>🧂 Ingredientes</h3><table><thead><tr><th>Artículo</th><th>Unidad</th><th>Unidades</th><th>% Merma</th><th>Costo Línea</th></tr></thead><tbody>'+
    r.ing.map(g=>'<tr><td>'+g.a+'</td><td>'+g.u+'</td><td>'+(g.un!==null?g.un:'')+'</td><td>'+(g.me!==null?g.me+'%':'')+'</td><td>'+(g.cl!==null?fCOP(g.cl):'')+'</td></tr>').join('')+
    '</tbody></table></div>':'')+
    '<div class="ms"><h3>📊 Análisis de Costos</h3><div class="ag">'+
    (r.an.cp!==null?'<div class="ai"><div class="lb">Costo del Plato</div><div class="vl vc">'+fCOP(r.an.cp)+'</div></div>':'')+
    (r.an.cv!==null?'<div class="ai"><div class="lb">Valor de Venta</div><div class="vl vv">'+fCOP(r.an.cv)+'</div></div>':'')+
    (r.an.cg!==null?'<div class="ai"><div class="lb">Ganancia</div><div class="vl vg">'+fCOP(r.an.cg)+'</div></div>':'')+
    (r.an.ma?'<div class="ai"><div class="lb">Margen</div><div class="vl vm">'+r.an.ma+'</div></div>':'')+
    '</div></div>'+
    (r.proc?'<div class="ms"><h3>👨‍🍳 Elaboración</h3><p class="pt">'+r.proc+'</p></div>':'')+
    '</div>';
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){if(e.target===document.getElementById('ov'))closeM();}
function closeM(){document.getElementById('ov').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
function filterRecipes(q){
  q=q.toLowerCase().trim();
  if(!q){renderRecipes(AR);return;}
  const f=AR.filter(r=>r.n.toLowerCase().includes(q)||(r.desc&&r.desc.toLowerCase().includes(q))||r.ing.some(g=>g.a.toLowerCase().includes(q)));
  const mc=document.getElementById('mc');
  mc.innerHTML=f.length?'<div class="grid">'+f.map((r,i)=>card(r,AR.indexOf(r))).join('')+'</div>':'<div class="nr"><div class="ic">🔍</div><p>Sin resultados para "<strong>'+q+'</strong>"</p></div>';
}
setInterval(()=>{delete CA[CS];loadSheet(null);},5*60*1000);
loadSheet(document.querySelector('.tb.active'));
</script>
</body>
</html>
