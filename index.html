<!DOCTYPE html>
<!--
  ============================================================================
  RECETARIO MALANGA · Visor de recetas digital
  ============================================================================
  Aplicación de una sola página (SPA) sin dependencias ni framework.

  ARQUITECTURA
  ------------
  1. FUENTE DE DATOS: una hoja de cálculo de Google Sheets. Cada pestaña
     (categoría: ENTRADAS, CEVICHES, etc.) se exporta como CSV mediante la URL
     pública de export y se identifica por su `gid` (ver array SHEETS).
  2. FOTOS: se sirven desde Google Drive a partir del nombre de la receta,
     usando el mapa NOMBRE -> ID de Drive (ver objeto PHOTOS).
  3. RENDER: el CSV se parsea a objetos `recipe`, se construye la barra lateral
     por secciones y se pinta la cuadrícula/lista de tarjetas. Al hacer clic se
     abre un modal con ingredientes, pasos y foto.
  4. REFRESCO: `loadAll()` se ejecuta al inicio y luego cada 5 minutos.

  TODO ES ESTÁTICO: este archivo se puede desplegar tal cual (Vercel) sin build.
  ============================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Recetario Malanga</title>
<style>
/* ===========================================================================
   1. RESET Y TOKENS DE DISEÑO
   =========================================================================== */
*{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Paleta (verde Malanga sobre crema). Varios alias apuntan al mismo verde
     por compatibilidad con nombres usados en distintas partes del CSS. */
  --cream:#F9E8E8;
  --cream2:#F2D8D8;
  --brown:#2B4D2E;
  --orange:#2B4D2E;
  --green:#2B4D2E;
  --dark:#1a2e1c;
  --mid:#3d5c40;
  --light:#5a7a5d;
  --white:#ffffff;
  --shadow:0 2px 16px rgba(43,77,46,.15);
  --red:#cc2200;
  --sidebar:#2B4D2E;
  --border:#c8d8c9;
  --card:#ffffff;
  --accent:#2B4D2E;
  --accent2:#1e3820;
}

body{
  font-family:'Segoe UI',Georgia,sans-serif;
  background:var(--cream);
  color:var(--dark);
  display:flex;
  min-height:100vh;
}

/* ===========================================================================
   2. BARRA LATERAL (categorías)
   =========================================================================== */
.sidebar{width:260px;min-width:260px;background:var(--sidebar);border-right:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.15)}
.logo-box{display:flex;align-items:center;gap:12px}
.logo-icon{font-size:2rem;background:rgba(255,255,255,.15);border-radius:12px;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.logo-text h1{font-size:1.3rem;font-weight:700;color:#fff}
.logo-text p{font-size:.75rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.05em}

/* Botón "Todas las Recetas" */
.sidebar-all{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin:8px 12px;border-radius:8px;cursor:pointer;font-size:.875rem;color:rgba(255,255,255,.75);transition:.15s}
.sidebar-all:hover,.sidebar-all.active{background:rgba(255,255,255,.2);color:#fff}
.sa-left{display:flex;align-items:center;gap:8px}
.sa-count{background:rgba(255,255,255,.2);border-radius:12px;padding:2px 8px;font-size:.75rem;font-weight:600;color:#fff}

/* Títulos de sección (COCINA, BEBIDAS, ...) e ítems de categoría */
.sidebar-section{padding:16px 16px 6px;font-size:.65rem;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em}
.sidebar-item{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;margin:2px 8px;border-radius:7px;cursor:pointer;font-size:.82rem;color:rgba(255,255,255,.7);transition:.15s}
.sidebar-item:hover{background:rgba(255,255,255,.12);color:#fff}
.sidebar-item.active{background:rgba(255,255,255,.22);color:#fff}
.si-left{display:flex;align-items:center;gap:8px}
.si-icon{font-size:1rem}
.si-count{font-size:.72rem;color:rgba(255,255,255,.5);background:rgba(255,255,255,.1);border-radius:10px;padding:1px 7px}
.sidebar-item.active .si-count{background:rgba(255,255,255,.25);color:#fff}

/* ===========================================================================
   3. ÁREA PRINCIPAL (barra de estado, encabezado, buscador)
   =========================================================================== */
.main{flex:1;display:flex;flex-direction:column;min-height:100vh;overflow-y:auto}
.status-bar{display:flex;align-items:center;gap:8px;padding:6px 28px;background:var(--cream2);border-bottom:1px solid var(--border);font-size:.75rem;color:var(--light)}
.status-dot{width:7px;height:7px;border-radius:50%;background:#aaa;flex-shrink:0}
.status-dot.ok{background:#4caf50}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:28px 28px 8px}
.topbar-title h2{font-size:1.8rem;font-weight:700;color:var(--dark)}
.topbar-title p{font-size:.875rem;color:var(--light);margin-top:4px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.view-btn{background:var(--cream2);border:1px solid var(--border);color:var(--mid);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:1rem;transition:.15s}
.view-btn.active,.view-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-wrap{padding:8px 28px 16px}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;box-shadow:0 1px 4px rgba(43,77,46,.08)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--dark);font-size:.9rem}
.search-box input::placeholder{color:var(--light)}

/* ===========================================================================
   4. CUADRÍCULA Y TARJETAS DE RECETA
   =========================================================================== */
.grid-wrap{padding:0 20px 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.grid.list-mode{grid-template-columns:1fr}
.card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s;border:1px solid var(--border);box-shadow:0 1px 6px rgba(43,77,46,.08)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
/* Miniatura de tarjeta: usa object-fit:cover (recorte) a propósito; las
   miniaturas se ven mejor llenando el recuadro fijo. */
.card-img{height:160px;background:var(--cream2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img-ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--light);font-size:.75rem}
.logo-plate{font-size:2.5rem}
.list-mode .card{display:flex;flex-direction:row}
.list-mode .card-img{width:100px;min-width:100px;height:80px}
.card-body{padding:14px}
.card-cat{font-size:.65rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.card-name{font-size:1rem;font-weight:600;color:var(--dark);line-height:1.3}
.card-divider{height:1px;background:var(--border);margin:10px 0}
.card-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--light)}
.meta-steps{color:var(--accent);font-weight:600}

/* Estados de carga / vacío */
.loading-state,.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--light);gap:16px;grid-column:1/-1}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===========================================================================
   5. MODAL DE DETALLE
   =========================================================================== */
.modal-bg{position:fixed;inset:0;background:rgba(43,77,46,.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);box-shadow:0 8px 32px rgba(43,77,46,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border);background:var(--sidebar)}
.m-cat{font-size:.7rem;font-weight:700;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.m-name{font-size:1.4rem;font-weight:700;color:#fff}
.modal-close{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0}
.modal-close:hover{background:rgba(255,255,255,.25)}
.modal-body{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px;background:#fff}

/* FOTO DEL MODAL ----------------------------------------------------------
   Comportamiento UNIVERSAL: se adapta a CUALQUIER foto (vertical, horizontal,
   cuadrada, gigante o pequeña) y siempre se ve COMPLETA, sin recortarse.
   Cómo: la imagen conserva su proporción natural (width/height:auto) y solo se
   limita su tamaño con dos topes:
     - max-width:100%            -> nunca más ancha que el modal.
     - max-height:min(60vh,560px) -> nunca más alta que ~60% de la pantalla
                                      (con tope duro de 560px). Se adapta al
                                      tamaño de la ventana.
   La que mande primero (alto o ancho) es la que ajusta; la imagen se reduce
   proporcionalmente hasta entrar entera. El contenedor la centra con flexbox y
   es transparente (no deja barras de color): el marco "abraza" la foto. */
.modal-photo{width:100%;display:flex;align-items:center;justify-content:center;background:transparent}
.modal-photo img{display:block;max-width:100%;max-height:min(60vh,560px);width:auto;height:auto;border-radius:10px}

/* Tabla de ingredientes */
.section-title{font-size:.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.ing-table{width:100%;border-collapse:collapse;font-size:.85rem}
.ing-table th{text-align:left;padding:6px 8px;color:var(--light);font-weight:600;border-bottom:2px solid var(--border)}
.ing-table td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--mid)}
.ing-table tr:last-child td{border-bottom:none}
.td-name{color:var(--dark)!important;font-weight:500}

/* Pasos (Preparación / Emplatado) */
.steps-wrap{display:flex;flex-direction:column;gap:16px}
.steps-section-title{font-size:.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.step-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.step-num{min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.step-num.orange{background:var(--accent);color:#fff}
.step-num.teal{background:#5a8f5d;color:#fff}
.step-text{font-size:.875rem;color:var(--mid);line-height:1.5}

/* Notas y rendimiento */
.notes-block{background:var(--cream);border-radius:10px;padding:14px;border:1px solid var(--border)}
.notes-title{font-size:.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.notes-text{font-size:.85rem;color:var(--mid);line-height:1.6}
.rendimiento-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:20px;padding:4px 14px;font-size:.8rem;font-weight:700;margin-bottom:0}
.rendimiento-wrap{border-top:2px solid var(--border);padding-top:14px;display:flex;align-items:center;gap:10px}
.rendimiento-label{font-size:.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}

/* ===========================================================================
   6. RESPONSIVE (móvil: oculta barra lateral, cuadrícula a 2 columnas)
   =========================================================================== */
@media(max-width:700px){.sidebar{display:none}.topbar{padding:16px 16px 8px}.grid-wrap{padding:0 10px 24px}.grid{grid-template-columns:1fr 1fr;gap:12px}.topbar-title h2{font-size:1.3rem}}
</style>
</head>

<!-- ===== BARRA LATERAL ===== -->
<aside class="sidebar" id="sidebar">
<div class="sidebar-logo">

</div>

</div>
<div class="modal-body" id="modal-body"></div>
</div>
</div>

/* ===========================================================================
   ESTADO GLOBAL
   =========================================================================== */
let allRecipes=[];      // todas las recetas cargadas
let currentCat='ALL';   // categoría activa ('ALL' = todas)
let searchQ='';         // texto de búsqueda actual
let viewMode='grid';    // 'grid' | 'list'

/* Encabezados/columnas a ignorar al detectar nombres de receta o ingredientes */
const SKIP_RE=/^(artículo|articulo|ingrediente|und|unidad|coste|costo|item|total|columna)/i;
/* Palabras que representan unidades de medida (no son nombres de ingrediente) */
const UNIT_WORDS=['g','kg','uds','und','ml','l','oz','lb','gr','cc','porciones','onz'];

/** @returns {boolean} true si `v` es una unidad de medida conocida. */
function isUnit(v){
  return UNIT_WORDS.includes((v||'').toLowerCase().trim());
}

  /** Formatea una cantidad: enteros sin decimales, decimales significativos
   *  sin ceros sobrantes, y corrige errores de punto flotante (p.ej. 50.000001 -> 50). */
  function fmtQty(v){
    if(v==null) return '-';
    if(typeof v==='string'){
      var s=v.trim();
      if(s==='') return '-';
      var nstr=s.replace(/\s/g,'').replace(',', '.');
      var nn=Number(nstr);
      if(!isFinite(nn)) return s;
      v=nn;
    }
    if(typeof v!=='number'||!isFinite(v)) return String(v);
    var r=Math.round(v*10000)/10000;
    return parseFloat(r.toFixed(4)).toString();
  }

/* ===========================================================================
   PARSEO DE CSV
   =========================================================================== */
/**
 * Convierte el texto CSV en una matriz de filas (cada fila = array de celdas).
 * Respeta comillas dobles y comillas escapadas ("") dentro de una celda.
 * @param {string} t Texto CSV crudo.
 * @returns {string[][]} Filas con celdas ya recortadas (trim).
 */
function parseCSV(t){
  const rows=[];
  for(const line of t.split('\n')){
    const cols=[];
    let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        // Comilla escapada ("") -> comilla literal; si no, alterna el modo "dentro de comillas".
        if(inQ&&line[i+1]==='"'){cur+='"';i++;}
        else inQ=!inQ;
      }else if(ch===','&&!inQ){
        cols.push(cur.trim());cur='';
      }else{
        cur+=ch;
      }
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

/* ===========================================================================
   PARSEO DE RECETAS
   ---------------------------------------------------------------------------
   Las hojas vienen en dos formatos posibles según en qué columna está el
   nombre de la receta:
     - Formato 'A': nombre de receta en la columna 0 (c0).
     - Formato 'B': nombre de receta en la columna 1 (c1); columna 0 vacía.
   Heurística: se recorre la hoja hasta encontrar la primera fila que parezca
   un nombre de receta y se decide el formato.
   En ambos formatos, la columna 12 (c12) contiene los pasos, con marcadores
   "PREPARACION"/"EMPLATADO" que cambian a qué lista se agregan los siguientes.
   =========================================================================== */
/**
 * @param {string[][]} rows Filas ya parseadas del CSV.
 * @param {string} sheetName Nombre de la categoría (pestaña).
 * @returns {Array<Object>} Recetas con name, category, ingredients, prepSteps,
 *   plateSteps, notes y rendimiento. Se filtran las que no tienen ingredientes.
 */
function parseRecipes(rows,sheetName){
  const recipes=[];
  let cur=null;

  // --- Detección de formato (A o B) ---
  let fmt='B';
  for(const row of rows){
    const c0=(row[0]||'').trim();
    const c1=(row[1]||'').trim();
    if(c0&&!c1&&c0.length>3&&!SKIP_RE.test(c0)&&!c0.includes('$')&&!c0.match(/^[0-9]/)){fmt='A';break;}
    if(!c0&&c1&&c1.length>3&&!SKIP_RE.test(c1)&&!c1.includes('$')&&!c1.match(/^[0-9]/)){fmt='B';break;}
  }

  // --- Recorrido principal ---
  for(const row of rows){
    const c0=(row[0]||'').trim();
    const c1=(row[1]||'').trim();
    const c2=(row[2]||'').trim();
    const c3=(row[3]||'').trim();
    const c4=(row[4]||'').trim();
    const c12=(row[12]||'').trim();

    // c12 = celda de pasos. Detecta si es un marcador de sección o un paso real.
    const mLow=c12.toLowerCase();
    const isSL=mLow==='preparacion'||mLow==='preparación'||mLow==='emplatado';
    const isStep=c12&&!isSL&&c12.length>3&&!c12.includes('$')&&!c12.includes('#');

    if(fmt==='B'){
      const isH=SKIP_RE.test(c1)||/^(unidad|unidades)/i.test(c2);                       // fila de encabezado
      const isRN=!c0&&c1&&!c2&&!c3&&!isH&&c1.length>2&&!isUnit(c1)&&!/^[$#0-9]/.test(c1); // fila de nombre de receta
      if(isRN){
        cur={name:c1,category:sheetName,ingredients:[],prepSteps:[],plateSteps:[],notes:'',rendimiento:null};
        recipes.push(cur);
        continue;
      }
      if(!cur)continue;
      // Marcadores de sección: cambian el destino de los siguientes pasos.
      if(mLow==='emplatado')cur._ip=true;
      else if(mLow==='preparacion'||mLow==='preparación')cur._ip=false;
      // Rendimiento (columnas 9 y 10).
      if((row[9]||'').toLowerCase().includes('rendimiento')&&row[10])cur.rendimiento=row[10].trim();
      // Pasos: a emplatado (_ip=true) o a preparación.
      if(isStep){if(cur._ip)cur.plateSteps.push(c12);else cur.prepSteps.push(c12);}
      // Ingrediente: nombre en c1, unidad en c2, cantidad en c3.
      if(c1&&!isH&&!isUnit(c1)&&c1.length>1&&(c2||c3)&&!c1.startsWith('$')&&!c1.startsWith('#')&&!/^[0-9]+$/.test(c1)){
        cur.ingredients.push({name:c1,unit:c2,qty:c3});
      }
    }else{
      const isH=SKIP_RE.test(c0)||/^(unidad|unidades)/i.test(c1);                                  // fila de encabezado
      const isRN=c0&&!c1&&!c2&&!isH&&c0.length>2&&!isUnit(c0)&&!/^[$#0-9]/.test(c0)&&!c0.includes('$'); // nombre de receta
      if(isRN){
        cur={name:c0,category:sheetName,ingredients:[],prepSteps:[],plateSteps:[],notes:'',rendimiento:null};
        recipes.push(cur);
        continue;
      }
      if(!cur)continue;
      // Ingrediente: nombre en c0, unidad en c1, cantidad en c4.
      if(c0&&!isH&&!isUnit(c0)&&c0.length>1&&(c1||c4)&&!c0.startsWith('$')&&!/^[0-9]+$/.test(c0)){
        cur.ingredients.push({name:c0,unit:c1,qty:c4});
      }
    }
  }

  // Solo recetas con nombre e ingredientes válidos.
  return recipes.filter(r=>r.name&&r.ingredients.length>0);
}

/* ===========================================================================
   CARGA DESDE GOOGLE SHEETS
   =========================================================================== */
/**
 * Descarga y parsea una pestaña. Reintenta hasta 3 veces con backoff y maneja
 * el rate-limit (HTTP 429) de Google. Si todo falla, devuelve [].
 * @param {Object} sh Entrada de SHEETS.
 * @returns {Promise<Array<Object>>} Recetas de esa pestaña.
 */
async function loadSheet(sh){
  const url='https://docs.google.com/spreadsheets/d/'+SID+'/export?format=csv&gid='+sh.gid;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const r=await fetch(url);
      // 429 = demasiadas peticiones: espera creciente y reintenta.
      if(r.status===429){await new Promise(r=>setTimeout(r,2000*(attempt+1)));continue;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const t=await r.text();
      // Si Google devuelve HTML/JSONP en vez de CSV, no es válido.
      if(t.includes('/*O_o*/')||t.includes('<!DOCTYPE'))throw new Error('Not CSV');
      return parseRecipes(parseCSV(t),sh.name);
    }catch(e){
      if(attempt<2){await new Promise(r=>setTimeout(r,1500*(attempt+1)));}
      else{console.warn('Sheet:',sh.name,e.message);return[];}
    }
  }
  return[];
}

/**
 * Carga todas las pestañas en lotes de 4 (para no saturar a Google), actualiza
 * el estado y vuelve a pintar barra lateral y cuadrícula.
 */
async function loadAll(){
  setStatus('loading','Cargando recetas...');
  allRecipes=[];
  const BATCH=4;
  for(let i=0;i<SHEETS.length;i+=BATCH){
    const batch=SHEETS.slice(i,i+BATCH);
    const res=await Promise.allSettled(batch.map(s=>loadSheet(s)));
    res.forEach(r=>{if(r.status==='fulfilled')allRecipes.push(...r.value);});
    if(i+BATCH<SHEETS.length)await new Promise(r=>setTimeout(r,600)); // pausa entre lotes
  }
  buildSidebar();
  renderGrid();
  // 'v2-foto' es un marcador de versión: si lo ves en la barra de estado del
  // sitio desplegado, confirma que este código (con el arreglo de la foto) está
  // realmente en vivo. Puedes quitarlo cuando ya no lo necesites.
  setStatus('ok',allRecipes.length+' recetas cargadas • v2-foto • '+new Date().toLocaleTimeString('es-CO'));
}

/** Actualiza el indicador de estado (punto + texto). @param {string} s @param {string} t */
function setStatus(s,t){
  document.getElementById('status-dot').className='status-dot'+(s==='ok'?' ok':'');
  document.getElementById('status-txt').textContent=t;
}

/* ===========================================================================
   RENDER: BARRA LATERAL
   =========================================================================== */
/** Construye las secciones y categorías de la barra lateral con sus conteos. */
function buildSidebar(){
  // Conteo de recetas por categoría.
  const cnt={};
  allRecipes.forEach(r=>{cnt[r.category]=(cnt[r.category]||0)+1;});
  document.getElementById('count-all').textContent=allRecipes.length;

  // Agrupa las categorías (que tengan recetas) por su sección.
  const sects={};
  SHEETS.forEach(s=>{
    if(!cnt[s.name])return;
    if(!sects[s.section])sects[s.section]=[];
    sects[s.section].push({...s,count:cnt[s.name]});
  });

  // Genera el HTML de cada sección y sus ítems.
  let h='';
  for(const[sec,items]of Object.entries(sects)){
    h+='<div class="sidebar-section">'+sec+'</div>';
    items.forEach(s=>{
      const id='si-'+s.name.replace(/ /g,'_');
      h+='<div class="sidebar-item" id="'+id+'" onclick="filterCat(this.dataset.cat)" data-cat="'+s.name+'"><span class="si-left"><span class="si-icon">'+s.icon+'</span>'+s.name.charAt(0)+s.name.slice(1).toLowerCase()+'</span><span class="si-count">'+s.count+'</span></div>';
    });
  }
  document.getElementById('sidebar-cats').innerHTML=h;
}

/* ===========================================================================
   FILTROS Y BÚSQUEDA
   =========================================================================== */
/** Filtra por categoría (limpia la búsqueda y marca el ítem activo). */
function filterCat(cat){
  currentCat=cat;
  searchQ='';
  document.getElementById('search-input').value='';
  document.querySelectorAll('.sidebar-item').forEach(e=>e.classList.remove('active'));
  document.getElementById('btn-all').classList.toggle('active',cat==='ALL');
  if(cat!=='ALL'){
    const e=document.getElementById('si-'+cat.replace(/ /g,'_'));
    if(e)e.classList.add('active');
  }
  renderGrid();
}

/** Lee el texto del buscador y vuelve a pintar la cuadrícula. */
function handleSearch(){
  searchQ=document.getElementById('search-input').value.toLowerCase().trim();
  renderGrid();
}

/** Devuelve las recetas que pasan el filtro de categoría + búsqueda. */
function getFiltered(){
  let l=allRecipes;
  if(currentCat!=='ALL')l=l.filter(r=>r.category===currentCat);
  if(searchQ)l=l.filter(r=>r.name.toLowerCase().includes(searchQ)||r.ingredients.some(i=>i.name.toLowerCase().includes(searchQ)));
  return l;
}

/** Cambia entre vista cuadrícula y lista. @param {string} m 'grid' | 'list' */
function setView(m){
  viewMode=m;
  document.getElementById('btn-grid').classList.toggle('active',m==='grid');
  document.getElementById('btn-list').classList.toggle('active',m==='list');
  renderGrid();
}

/* ===========================================================================
   RENDER: CUADRÍCULA DE TARJETAS
   =========================================================================== */
/** Construye la URL de imagen de Drive (ancho 1000px). @param {string} id */
function driveUrl(id){return'https://lh3.googleusercontent.com/d/'+id+'=w1000';}

/** Devuelve el HTML de la miniatura de una tarjeta (foto o placeholder). */
function getCardImg(r){
  const ph=PHOTOS[r.name.toUpperCase().trim()];
  if(ph)return'<div class="card-img card-img-photo"><img src="'+driveUrl(ph)+'" alt="" loading="lazy" onerror="this.parentElement.className=\"card-img\""></div>';
  return'<div class="card-img"><div class="card-img-ph"><div class="logo-plate">🌿</div><span>'+r.category+'</span></div></div>';
}

/** Pinta el título, subtítulo y la cuadrícula/lista de tarjetas filtradas. */
function renderGrid(){
  const list=getFiltered();
  const cat=currentCat==='ALL'?'Todas las Recetas':currentCat.charAt(0)+currentCat.slice(1).toLowerCase();
  document.getElementById('page-title').textContent=cat;
  document.getElementById('page-sub').textContent=list.length+' receta'+(list.length===1?'':'s');

  const grid=document.getElementById('grid');
  grid.className='grid'+(viewMode==='list'?' list-mode':'');

  if(!list.length){grid.innerHTML='<div class="empty-state"><p>No se encontraron recetas</p></div>';return;}

  grid.innerHTML=list.map(r=>{
    const idx=allRecipes.indexOf(r);
    const steps=r.prepSteps.length+r.plateSteps.length;
    return '<div class="card" onclick="openModal('+idx+')">'+getCardImg(r)+'<div class="card-body"><div class="card-cat">'+r.category+'</div><div class="card-name">'+r.name+'</div><div class="card-divider"></div><div class="card-meta"><span>'+r.ingredients.length+' ingrediente'+(r.ingredients.length===1?'':'s')+'</span>'+(steps?'<span class="meta-steps">'+steps+' paso'+(steps===1?'':'s')+'</span>':'')+'</div></div></div>';
  }).join('');
}

/* ===========================================================================
   MODAL DE DETALLE
   =========================================================================== */
/**
 * Abre el modal con el detalle de la receta en `allRecipes[idx]`:
 * foto (si existe), tabla de ingredientes, rendimiento, pasos y notas.
 * @param {number} idx Índice en allRecipes.
 */
function openModal(idx){
  const r=allRecipes[idx];
  if(!r)return;
  document.getElementById('m-cat').textContent=r.category;
  document.getElementById('m-name').textContent=r.name;

  let body='';

  // Foto (opcional). Si falla la carga, se oculta el contenedor.
  const ph=PHOTOS[r.name.toUpperCase().trim()];
  if(ph)body+='<div class="modal-photo"><img src="'+driveUrl(ph)+'" alt="" loading="lazy" onerror="this.parentElement.style.display=\"none\""></div>';

  // Tabla de ingredientes.
  if(r.ingredients.length){
    body+='<div class="section-block"><div class="section-title">Ingredientes</div><table class="ing-table"><thead><tr><th>Artículo</th><th>Unidad de Medida</th><th>Cantidad</th></tr></thead><tbody>'+r.ingredients.map(i=>'<tr><td class="td-name">'+i.name+'</td><td>'+(i.unit||'-')+'</td><td>'+fmtQty(i.qty)+'</td></tr>').join('')+'</tbody></table></div>';
  }

  // Rendimiento (opcional).
  if(r.rendimiento){
    body+='<div class="rendimiento-wrap"><span class="rendimiento-label">Rendimiento</span><span class="rendimiento-badge">⚖ '+fmtQty(r.rendimiento)+' g</span></div>';
  }

  // Pasos: Preparación (numeración naranja) y Emplatado (numeración teal).
  if(r.prepSteps.length||r.plateSteps.length){
    body+='<div class="steps-wrap">';
    if(r.prepSteps.length){
      body+='<div class="steps-section"><div class="steps-section-title">Preparación</div>'+r.prepSteps.map((s,i)=>'<div class="step-item"><div class="step-num orange">'+(i+1)+'</div><div class="step-text">'+s+'</div></div>').join('')+'</div>';
    }
    if(r.plateSteps.length){
      body+='<div class="steps-section"><div class="steps-section-title">Emplatado</div>'+r.plateSteps.map((s,i)=>'<div class="step-item"><div class="step-num teal">'+(i+1)+'</div><div class="step-text">'+s+'</div></div>').join('')+'</div>';
    }
    body+='</div>';
  }

  // Notas (opcional).
  if(r.notes&&r.notes.trim()){
    body+='<div class="notes-block"><div class="notes-title">Notas de Cocina</div><div class="notes-text">'+r.notes.trim()+'</div></div>';
  }

  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow='hidden'; // bloquea el scroll de fondo
}

/** Cierra el modal solo si se hizo clic en el fondo (no en el contenido). */
function closeModal(e){
  if(e.target===document.getElementById('modal-bg'))closeModalDirect();
}

/** Cierra el modal y restaura el scroll del body. */
function closeModalDirect(){
  document.getElementById('modal-bg').classList.remove('open');
  document.body.style.overflow='';
}

/* ===========================================================================
   ARRANQUE: carga inicial + refresco automático cada 5 minutos.
   =========================================================================== */
loadAll();
setInterval(loadAll,5*60*1000);
